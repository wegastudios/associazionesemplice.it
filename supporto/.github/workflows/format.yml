name: format
on: workflow_dispatch
permissions:
  contents: write
jobs:
  pint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: intl, sodium, pdo_mysql, bcmath
          tools: composer
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/pint
      - name: Commit formattazione
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Formattazione Pint"
          git push