# BEGIN AssociazioneSemplice demo (non modificare a mano: lo gestisce deploy/demo-webroot.sh)
# Cartella pubblica della demo (public_html): contiene solo questo .htaccess, index.php di avvio, i collegamenti ai file
# statici della versione in uso e .well-known. Il codice, .env, storage e vendor stanno in ~/saas-demo, fuori da qui.
Options -Indexes
<IfModule mod_negotiation.c>
    Options -MultiViews
</IfModule>

# File di configurazione di cPanel/PHP e simili: mai serviti.
<FilesMatch "^(\.user\.ini|php\.ini|\.htaccess|\.env.*|composer\..*|artisan|.*\.(log|sh|md|lock|json|yml|yaml|sql|bak))$">
    Require all denied
</FilesMatch>

<IfModule mod_rewrite.c>
    RewriteEngine On

    # AutoSSL / DCV scrivono qui: restano file veri, serviti come sono.
    RewriteRule ^\.well-known/ - [L]

    # Ogni altro file o cartella nascosti (.git, .env, .user.ini...): vietato.
    RewriteRule (^|/)\. - [F]

    # Header di autorizzazione e token XSRF fino a PHP.
    RewriteCond %{HTTP:Authorization} .
    RewriteRule .* - [E=HTTP_AUTHORIZATION:%{HTTP:Authorization}]
    RewriteCond %{HTTP:x-xsrf-token} .
    RewriteRule .* - [E=HTTP_X_XSRF_TOKEN:%{HTTP:X-XSRF-Token}]

    # robots.txt lo risponde l'applicazione: nella demo nega tutto ai motori di ricerca.
    RewriteRule ^robots\.txt$ index.php [L]

    # Barra finale tolta (se non è una cartella).
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_URI} (.+)/$
    RewriteRule ^ %1 [L,R=301]

    # Tutto il resto, se non è un file vero, all'applicazione.
    RewriteCond %{REQUEST_FILENAME} !-d
    RewriteCond %{REQUEST_FILENAME} !-f
    RewriteRule ^ index.php [L]
</IfModule>

# File statici: i file di build hanno il contenuto nel nome; font e immagini fisse un mese.
<IfModule mod_headers.c>
    <FilesMatch "\.(js|css|woff2?|ttf|svg|png|jpe?g|gif|ico|webp)$">
        Header set Cache-Control "public, max-age=2592000"
    </FilesMatch>
    <If "%{REQUEST_URI} =~ m#^/build/#">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </If>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Cross-Origin-Opener-Policy "same-origin"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Header always set X-Robots-Tag "noindex, nofollow, noarchive, nosnippet"
</IfModule>
# END AssociazioneSemplice demo
