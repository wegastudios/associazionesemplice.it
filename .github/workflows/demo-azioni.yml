name: Demo, azioni classificate

# Ogni azione asem_front_* del plugin deve essere permessa o vietata in demo/asem-demo.php: una nuova non classificata fermerebbe i visitatori («Nella demo questa azione non è disponibile»).
on:
  push:
    branches: [main]
    paths: ["wordpress/**", "demo/**", ".github/workflows/demo-azioni.yml"]
  pull_request:
    paths: ["wordpress/**", "demo/**", ".github/workflows/demo-azioni.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  azioni:
    name: Azioni del plugin classificate nella demo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash demo/check-azioni.sh
