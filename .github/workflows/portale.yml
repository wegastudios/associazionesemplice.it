name: Portale

on:
  push:
    branches: [main, "feature/**"]
    paths: ["portale/**", ".github/workflows/portale.yml"]
  pull_request:
    paths: ["portale/**", ".github/workflows/portale.yml"]
  workflow_dispatch:

jobs:
  test:
    name: Portale (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1", "8.3"]
    defaults:
      run:
        working-directory: portale
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, sodium, curl, intl, mbstring
      - name: Syntax check
        run: find . -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: php tests/run.php

  postgres:
    name: Portale (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: portale
          POSTGRES_PASSWORD: portale
          POSTGRES_DB: portale_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portale" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: portale
    env:
      PORTALE_TEST_PG_DSN: "pgsql:host=127.0.0.1;port=5432;dbname=portale_test"
      PORTALE_TEST_PG_USER: portale
      PORTALE_TEST_PG_PASS: portale
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, pdo_pgsql, sodium, curl, intl, mbstring
      - run: php tests/run.php
