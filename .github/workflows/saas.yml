name: SaaS

on:
  push:
    branches: [main, "feature/**", "claude/**"]
    paths: ["saas/**", ".github/workflows/saas.yml"]
  pull_request:
    paths: ["saas/**", ".github/workflows/saas.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: saas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: SaaS (PHP 8.3, PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: saas

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres-ci

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, sodium, intl, mbstring, redis
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('saas/composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Frontend (Vite)
        run: |
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
          npm run build

      - name: Controllo delle dipendenze
        run: composer audit --no-interaction

      - name: Ruoli e database di prova
        run: scripts/db-locale.sh

      - name: Ambiente
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Pint
        run: vendor/bin/pint --test -v

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Test
        run: vendor/bin/pest --colors=always
