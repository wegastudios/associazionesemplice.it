name: SaaS

on:
  push:
    branches: [main]
    paths: ["saas/**", ".github/workflows/saas.yml"]
  pull_request:
    paths: ["saas/**", ".github/workflows/saas.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: saas-${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.run_id || github.ref }}
  # Su main non si annulla: ogni testa di main deve avere la sua prova.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    name: SaaS (PHP 8.3, PostgreSQL 16)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: saas

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres-ci

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: pdo_pgsql, pgsql, sodium, intl, mbstring, redis
          coverage: none
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('saas/composer.lock') }}

      - run: composer install --no-interaction --no-progress --prefer-dist

      # Controllo di stile: non dipende da altro e fallisce subito.
      - name: Pint
        run: vendor/bin/pint --test

      # Come il pacchetto del server (deploy/build.sh, H21): autoloader «solo mappa». Una classe fuori dalla mappa
      # (cartella non dichiarata in composer.json, file generati) fa fallire i test qui e non in produzione.
      - name: Autoloader solo mappa
        run: composer dump-autoload --classmap-authoritative --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: saas/package-lock.json

      - name: Frontend (Vite)
        run: |
          npm ci --no-audit --no-fund
          # TEMPORANEO (17/11/2026): per un avviso su uno strumento di sviluppo senza versione corretta, il blocco vale per le
          # dipendenze di produzione; il controllo completo resta come avviso. Ripristinare `npm audit --audit-level=high`
          # appena esce la versione corretta.
          npm audit --omit=dev --audit-level=high
          npm audit --audit-level=high || echo "::warning::npm audit completo: avvisi su strumenti di sviluppo (non bloccante, temporaneo)"
          npm run build

      - name: Rotazione delle copie del .env (deploy/ops.sh)
        run: |
          bash tests/shell/ops-env-bak.sh
          bash tests/shell/ops-variabili.sh

      - name: Controllo delle dipendenze
        run: composer audit --no-interaction

      - name: Ruoli e database di prova
        run: scripts/db-locale.sh

      - name: Ambiente
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      # laravel/passkeys (dipendenza di webauthn-lib) potrebbe registrare rotte dal proprio provider auto-scoperto:
      # config/fortify.php ha 'passkeys' => null e qui ne abbiamo la certezza.
      - name: Nessuna rotta passkey/WebAuthn
        run: |
          filtro='.[] | select([.uri, .name, .action] | map(. // "") | join(" ") | test("passkey|webauthn"; "i")) | "\(.method) \(.uri) [\(.name // "-")] \(.action)"'
          # Prova del filtro su rotte finte: deve trovare le due positive e nessuna della negativa.
          pos='[{"method":"GET","uri":"passkeys/login","name":null,"action":"X"},{"method":"POST","uri":"a","name":"b","action":"App\\WebAuthn\\C@i"}]'
          neg='[{"method":"GET","uri":"login","name":"login","action":"App\\LoginController@show"}]'
          [ "$(echo "$pos" | jq -r "$filtro" | wc -l)" -eq 2 ] && [ -z "$(echo "$neg" | jq -r "$filtro")" ] || { echo "::error::Prova del filtro fallita"; exit 1; }
          php artisan route:list --json --no-interaction > routes.json
          echo "Rotte totali: $(jq length routes.json)"
          trovate=$(jq -r "$filtro" routes.json)
          rm routes.json
          if [ -n "$trovate" ]; then echo "::error::Rotte passkey/WebAuthn registrate:"; echo "$trovate"; exit 1; fi
          echo "Nessuna rotta passkey/WebAuthn (filtro provato)."

      # La configurazione si mette in cache come al rilascio, con l'ambiente di produzione d'esempio: un errore nei file di
      # config (per esempio una classe usata in config/queue.php) si vede qui e non sul server.
      - name: Configurazione in cache (ambiente di produzione d'esempio)
        run: |
          mv .env .env.ci
          cp deploy/env.server.example .env
          php artisan config:cache --no-interaction
          php -r '$c = require "bootstrap/cache/config.php"; exit(($c["queue"]["connections"]["database-long"]["retry_after"] ?? 0) >= 2100 && ($c["queue"]["connections"]["database"]["retry_after"] ?? 999) <= 120 ? 0 : 1);'
          php artisan config:clear --no-interaction
          mv .env.ci .env

      - name: PHPStan
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Test
        run: vendor/bin/pest --colors=always
