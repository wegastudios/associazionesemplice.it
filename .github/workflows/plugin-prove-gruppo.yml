name: Plugin group booking checks

# Prove della prenotazione di gruppo in wp-env: browser (anche senza JavaScript e da tastiera), richieste parallele, versioni. Solo prove.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/plugin-prove-gruppo.yml"
      - ".github/scripts/*gruppo*"

permissions:
  contents: read

jobs:
  browser:
    name: Gruppo nel browser
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and start WordPress (free only)
        shell: bash
        run: |
          bash wordpress/build.sh wordpress/dist
          cd wordpress/dist
          cat > .wp-env.json <<'JSON'
          {
            "phpVersion": "8.1",
            "plugins": ["./free/associazionesemplice"],
            "mappings": { "wp-content/sandbox-scripts": "../../.github/scripts" },
            "config": { "WP_DEBUG": true, "WP_DEBUG_DISPLAY": false, "WP_DEBUG_LOG": true }
          }
          JSON
          npx --yes @wordpress/env start
          npx --yes @wordpress/env run cli wp language core install it_IT --activate || true
      - name: Example data
        shell: bash
        working-directory: wordpress/dist
        run: |
          npx --yes @wordpress/env run cli wp eval-file wp-content/sandbox-scripts/prepara-prove-gruppo.php > "$RUNNER_TEMP/raw.txt" || { cat "$RUNNER_TEMP/raw.txt"; exit 1; }
          grep -o 'GRUPPO{.*}' "$RUNNER_TEMP/raw.txt" | sed 's/^GRUPPO//' > "$RUNNER_TEMP/dati.json"
          test -s "$RUNNER_TEMP/dati.json"
      - name: Install Playwright (Chromium)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Browser checks
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/prove-gruppo.cjs http://localhost:8888 "$RUNNER_TEMP/dati.json" prove-gruppo
      - name: Database checks
        if: always()
        shell: bash
        working-directory: wordpress/dist
        run: npx --yes @wordpress/env run cli wp eval-file wp-content/sandbox-scripts/verifica-prove-gruppo.php
      - name: Debug log
        if: always()
        shell: bash
        working-directory: wordpress/dist
        run: npx --yes @wordpress/env run cli sh -c 'grep -a "associazionesemplice" wp-content/debug.log 2>/dev/null | tail -20 || true'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prove-gruppo
          path: prove-gruppo/
          retention-days: 14
          if-no-files-found: warn

  versioni:
    name: Gruppo tra versioni
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Versions
        shell: bash
        run: bash .github/scripts/prova-gruppo-versioni.sh
