name: SaaS · manutenzione server

# Azioni fisse sul server del SaaS (saas/deploy/ops.sh): diagnosi in sola lettura, chiave di firma del catalogo,
# percorso di pg_dump. Non è una shell remota: l'azione è una scelta, non un comando. Solo da main, a mano.
# Stessi segreti del rilascio (ambiente production).

on:
  workflow_dispatch:
    inputs:
      action:
        description: Cosa fare
        type: choice
        options: [diagnosi, chiave-catalogo, percorso-pgdump, ciclo-vita, prova-cancellazione, catalogo, bozza-listino, accendi-ciclo-vita, spegni-cancellazione, pubblica-catalogo, soci-in-vendita, spegni-avvisi, conta-fotografie, sblocca-utente, cancellazioni, permessi-backup, interruttori, variabili, verifica-registro, indici-registro, formato-dry-run, coda, avvisa-catalogo, imposta-segreto-proxy, copie-env, pulisci-copie-env, permessi-db, permessi-diagnosi, ripristina-permessi, svuota-proxy-fidati, prova-recupero, misure, db-proprieta, revoca-gruppo, revoca-gruppo-esegui, db-connection-limit-60, db-connection-limit-off]
        default: diagnosi
      email:
        description: Solo per sblocca-utente, email di chi ha perso telefono e codici di recupero
        type: string
        required: false
      pg_bin_dir:
        description: Solo per percorso-pgdump (cartella dei programmi PostgreSQL 16, es. /usr/pgsql-16/bin)
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: saas-ops
  cancel-in-progress: false

jobs:
  ops:
    name: ${{ inputs.action }}
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: saas/deploy
      - name: Chiave SSH
        env:
          KEY: ${{ secrets.SAAS_SSH_PRIVATE_KEY }}
          KNOWN: ${{ secrets.SAAS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN" > ~/.ssh/known_hosts && chmod 644 ~/.ssh/known_hosts
      - name: Azione
        env:
          HOST: ${{ secrets.SAAS_SSH_HOST }}
          PORT: ${{ secrets.SAAS_SSH_PORT || '22' }}
          SSH_USER: ${{ secrets.SAAS_SSH_USER }}
          ACTION: ${{ inputs.action }}
          PG_BIN_DIR: ${{ inputs.pg_bin_dir }}
          EMAIL: ${{ inputs.email }}
        run: |
          # L'email finisce in un comando remoto: solo caratteri da indirizzo, altrimenti si ferma qui.
          if [ -n "$EMAIL" ] && ! printf '%s' "$EMAIL" | grep -Eq '^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}$'; then echo "Email non valida." >&2; exit 1; fi
          # Stesso per l'azione e per l'argomento (cartella di pg_dump): stessa regola di deploy/ops.sh.
          if ! printf '%s' "$ACTION" | grep -Eq '^[a-z]+(-[a-z0-9]+)*$'; then echo "Azione non valida." >&2; exit 1; fi
          if [ -n "$PG_BIN_DIR" ]; then
            if ! printf '%s' "$PG_BIN_DIR" | grep -Eq '^/[A-Za-z0-9_./-]+$'; then echo "Cartella non valida." >&2; exit 1; fi
          fi
          ssh -i ~/.ssh/deploy -p "$PORT" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "$SSH_USER@$HOST" \
            "bash -s -- '$ACTION' '$PG_BIN_DIR' '$EMAIL'" < saas/deploy/ops.sh
      - name: Pulizia
        if: always()
        run: rm -f ~/.ssh/deploy
