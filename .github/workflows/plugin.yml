name: WordPress plugin

on:
  push:
    branches: [main, "feature/**"]
    paths: ["wordpress/**", ".github/workflows/plugin.yml"]
  pull_request:
    paths: ["wordpress/**", ".github/workflows/plugin.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["7.4", "8.1", "8.3"]
    defaults:
      run:
        working-directory: wordpress/associazionesemplice
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, simplexml, libxml, gd, zip, openssl
          tools: composer
      - name: Syntax check
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit
      - name: PDF valid and readable (poppler)
        if: matrix.php == '8.1'
        run: |
          # la rete del runner può avere cali brevi (DNS dei mirror): si riprova qualche volta prima di dichiarare fallito il passo
          for i in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=5 update -qq && sudo apt-get -o Acquire::Retries=5 install -y -qq poppler-utils; then break; fi
            [ "$i" = 5 ] && { echo "poppler non installabile dopo 5 tentativi"; exit 1; }
            sleep $((i * 20))
          done
          php tests/pdf_sample.php /tmp/prova.pdf
          pdfinfo /tmp/prova.pdf | tee /tmp/info.txt
          grep -q '^Pages:.*2' /tmp/info.txt
          pdftotext -layout /tmp/prova.pdf /tmp/prova.txt
          cat /tmp/prova.txt
          grep -q 'RICEVUTA DI PAGAMENTO' /tmp/prova.txt
          grep -q 'N. 12/2026' /tmp/prova.txt
          grep -q 'Perché (famiglia)' /tmp/prova.txt
          grep -q '10,00 €' /tmp/prova.txt
          grep -q 'Seconda pagina' /tmp/prova.txt
      - name: QR codes decode with an independent reader (zbar)
        if: matrix.php == '8.1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zbar-tools
          php tests/qr_images.php /tmp/qr
          fail=0
          for f in /tmp/qr/*.png; do
            expected=$(cat "${f%.png}.txt")
            got=$(zbarimg --quiet --raw "$f" 2>/dev/null || true)
            if [ "$got" != "$expected" ]; then echo "NON LETTO/DIVERSO: $f"; echo "  atteso: $expected"; echo "  letto : $got"; fail=1; else echo "ok $(basename "$f")"; fi
          done
          exit $fail

  mysql8:
    name: Two real connections on MySQL 8 (lessons courses)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: prova
          MYSQL_DATABASE: prova
        ports: ["3306:3306"]
        options: --health-cmd="mysqladmin ping -pprova" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          extensions: mysqli
      - run: php .github/scripts/prova-mysql-concorrenza.php 127.0.0.1 root prova prova | tee -a "$GITHUB_STEP_SUMMARY"

  free:
    name: Free edition (without the advanced files)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wordpress
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Start WordPress (wp-env)
        run: |
          # misura del costo fisso per richiesta (tests/ci/costo-fisso.sh): un mu-plugin che lavora solo con l'intestazione X-Asem-Costo
          echo '{ "mappings": { "wp-content/mu-plugins": "./associazionesemplice/tests/ci/mu" } }' > .wp-env.override.json
          npx --yes @wordpress/env start
      - name: Remove the advanced files
        run: |
          grep -v '^#' associazionesemplice/tests/pro-files.txt | grep -v '^$' | while read -r f; do rm -v "associazionesemplice/includes/$f"; done
      - name: Run the free edition smoke test
        run: npx --yes @wordpress/env run cli wp eval-file wp-content/plugins/associazionesemplice/tests/smoke_free.php
      - name: Fixed cost per request (PHP files of the plugin read, classes loaded)
        run: |
          ck="$(npx --yes @wordpress/env run cli wp eval-file wp-content/plugins/associazionesemplice/tests/ci/costo-fisso-cookie.php 2>/dev/null | grep '^ASEMCOOKIE=' | sed 's/^ASEMCOOKIE=//' | tr -d '\r')"
          bash associazionesemplice/tests/ci/costo-fisso.sh http://localhost:8888 "$ck"
      - name: Debug log
        if: failure()
        run: npx --yes @wordpress/env run cli sh -c 'cat wp-content/debug.log 2>/dev/null | tail -50 || true'

  split:
    name: Free + Pro together behave like the full plugin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Build the two packages
        run: bash wordpress/build.sh wordpress/dist
      - name: Run the full tests against free + Pro
        working-directory: wordpress/dist
        run: |
          cp -r ../associazionesemplice/tests free/associazionesemplice/tests
          cat > .wp-env.json <<'JSON'
          {
            "phpVersion": "8.1",
            "plugins": [
              "./free/associazionesemplice",
              "./pro/associazionesemplice-pro",
              "https://downloads.wordpress.org/plugin/elementor.latest-stable.zip",
              "https://downloads.wordpress.org/plugin/wp-all-import.latest-stable.zip",
              "https://downloads.wordpress.org/plugin/woocommerce.latest-stable.zip"
            ],
            "mappings": { "wp-content/mu-plugins": "./free/associazionesemplice/tests/ci/mu" },
            "config": { "WP_DEBUG": true, "WP_DEBUG_DISPLAY": false, "WP_DEBUG_LOG": true }
          }
          JSON
          npx --yes @wordpress/env start
          npx --yes @wordpress/env run cli wp eval-file wp-content/plugins/associazionesemplice/tests/smoke.php
      - name: Fixed cost per request (PHP files of the plugin read, classes loaded)
        working-directory: wordpress/dist
        run: |
          ck="$(npx --yes @wordpress/env run cli wp eval-file wp-content/plugins/associazionesemplice/tests/ci/costo-fisso-cookie.php 2>/dev/null | grep '^ASEMCOOKIE=' | sed 's/^ASEMCOOKIE=//' | tr -d '\r')"
          bash free/associazionesemplice/tests/ci/costo-fisso.sh http://localhost:8888 "$ck"
      - name: Debug log
        if: failure()
        working-directory: wordpress/dist
        run: npx --yes @wordpress/env run cli sh -c 'cat wp-content/debug.log 2>/dev/null | tail -50 || true'

  combos:
    name: Updates of the Pro in the free + Pro combinations (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { id: a, wporg: "0", kind: portal, proapi: "", label: "a: portal free + Pro" }
          - { id: b, wporg: "1", kind: wporg, proapi: "", label: "b: WordPress.org free + Pro" }
          - { id: c, wporg: "1", kind: wporg, proapi: "17", label: "c: WordPress.org free + incompatible Pro" }
          - { id: c, wporg: "0", kind: portal, proapi: "17", label: "c: portal free + incompatible Pro" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Build the packages (free as for the portal or for WordPress.org)
        run: |
          if [ "${{ matrix.wporg }}" = "1" ]; then export ASEM_WPORG=1; fi
          bash wordpress/build.sh wordpress/dist
          if [ -n "${{ matrix.proapi }}" ]; then
            # Pro con un livello di compatibilità diverso da quello del gratuito
            sed -i -E "s/(define\( 'ASEM_PRO_API', )[0-9]+/\1${{ matrix.proapi }}/" wordpress/dist/pro/associazionesemplice-pro/associazionesemplice-pro.php
            grep -q "ASEM_PRO_API', ${{ matrix.proapi }}" wordpress/dist/pro/associazionesemplice-pro/associazionesemplice-pro.php
          fi
      - name: Start WordPress with free + Pro and run the combination test
        working-directory: wordpress/dist
        run: |
          mkdir -p free/associazionesemplice/tests/ci
          cp ../associazionesemplice/tests/ci/prova-aggiornatore-combinazioni.php free/associazionesemplice/tests/ci/
          cat > .wp-env.json <<'JSON'
          {
            "phpVersion": "8.1",
            "plugins": [ "./free/associazionesemplice", "./pro/associazionesemplice-pro" ],
            "config": { "WP_DEBUG": true, "WP_DEBUG_DISPLAY": false, "WP_DEBUG_LOG": true }
          }
          JSON
          npx --yes @wordpress/env start
          npx --yes @wordpress/env run cli wp eval-file wp-content/plugins/associazionesemplice/tests/ci/prova-aggiornatore-combinazioni.php ${{ matrix.id }} ${{ matrix.kind }}
      - name: Debug log
        if: failure()
        working-directory: wordpress/dist
        run: npx --yes @wordpress/env run cli sh -c 'cat wp-content/debug.log 2>/dev/null | tail -50 || true'

  package:
    name: Installable zips (WordPress.org and Pro)
    needs: [unit, free, split, combos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the packages
        run: bash wordpress/build.sh wordpress/dist
      - name: The free package has no trace of the Pro functions
        run: bash wordpress/check-free-clean.sh --strict
      - name: Front-end style sheet and script are minified in the package and still valid
        run: |
          for f in frontend.css frontend.js; do
            a=$(wc -c < "wordpress/dist/free/associazionesemplice/assets/$f"); b=$(wc -c < "wordpress/associazionesemplice/assets/$f")
            echo "$f: $b -> $a bytes"
            [ "$a" -lt "$b" ] || { echo "$f non ridotto nel pacchetto" >&2; exit 1; }
          done
          node --check wordpress/dist/free/associazionesemplice/assets/frontend.js
          grep -q 'asemf-form input\[type="tel"\]' wordpress/dist/free/associazionesemplice/assets/frontend.css
      - name: Only the portal package declares the portal contact (WordPress.org package does not)
        run: |
          grep -q 'associazionesemplice.it/api/plugin/update' wordpress/dist/free/associazionesemplice/readme.txt
          grep -q 'privacy_policy' wordpress/dist/free/associazionesemplice/includes/Updater.php
          ASEM_WPORG=1 bash wordpress/build.sh wordpress/dist-wporg
          test ! -f wordpress/dist-wporg/free/associazionesemplice/includes/Updater.php
          grep -q '^ \* Update URI: *https://associazionesemplice.it/$' wordpress/dist/free/associazionesemplice/associazionesemplice.php
          if grep -qi 'Update URI' wordpress/dist-wporg/free/associazionesemplice/associazionesemplice.php; then echo "Il pacchetto WordPress.org dichiara Update URI" >&2; exit 1; fi
          if grep -rIl 'api/plugin/update' wordpress/dist-wporg/free/associazionesemplice; then echo "Il pacchetto WordPress.org cita il contatto col portale" >&2; exit 1; fi
          if grep -rIlE 'asem_check_updates|asem_updater_free_version|asem_updater_recheck|asem_updater_forced|asem_pro_updater' wordpress/dist-wporg/free/associazionesemplice; then echo "Il pacchetto WordPress.org contiene tracce dell'aggiornatore" >&2; exit 1; fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: associazionesemplice-packages
          path: |
            wordpress/dist/associazionesemplice.zip
            wordpress/dist/associazionesemplice-pro.zip

  plugincheck:
    name: WordPress.org plugin check (free package)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the free package
        run: ASEM_WPORG=1 bash wordpress/build.sh wordpress/dist
      - name: Plugin check
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: wordpress/dist/free/associazionesemplice

  prostatic:
    name: Pro static check (Plugin Check rules)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.3"
          tools: composer
      - name: Build the packages
        run: bash wordpress/build.sh wordpress/dist
      - name: Pro package against the Plugin Check security rules (new findings fail)
        run: bash wordpress/check-pro-static.sh wordpress/dist/pro/associazionesemplice-pro
