name: Plugin visual checks 1.3.38

# Prove visive delle pagine di ruolo dentro wp-env con il solo plugin gratuito. Solo prove: gira a mano o quando cambiano questi file.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/plugin-prove-1338.yml"
      - ".github/scripts/prepara-prove-1338.php"
      - ".github/scripts/prove-visive-1338.cjs"

permissions:
  contents: read

jobs:
  visual:
    name: Prove visive 1.3.38
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build and start WordPress (free only)
        shell: bash
        run: |
          bash wordpress/build.sh wordpress/dist
          cd wordpress/dist
          cat > .wp-env.json <<'JSON'
          {
            "phpVersion": "8.1",
            "plugins": ["./free/associazionesemplice"],
            "mappings": { "wp-content/sandbox-scripts": "../../.github/scripts" },
            "config": { "WP_DEBUG": true, "WP_DEBUG_DISPLAY": false, "WP_DEBUG_LOG": true }
          }
          JSON
          npx --yes @wordpress/env start
          npx --yes @wordpress/env run cli wp language core install it_IT --activate || true
      - name: Example data
        shell: bash
        working-directory: wordpress/dist
        run: |
          npx --yes @wordpress/env run cli wp eval-file wp-content/sandbox-scripts/prepara-prove-1338.php > "$RUNNER_TEMP/raw.txt"
          grep -o 'PROVE1338{.*}' "$RUNNER_TEMP/raw.txt" | sed 's/^PROVE1338//' > "$RUNNER_TEMP/dati.json"
          test -s "$RUNNER_TEMP/dati.json"
      - name: Install Playwright (Chromium)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pw" && cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Visual checks
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/prove-visive-1338.cjs http://localhost:8888 "$RUNNER_TEMP/dati.json" prove-1338
      - name: Outcome
        if: always()
        shell: bash
        run: if [ -f prove-1338/esito.md ]; then cat prove-1338/esito.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prove-1338
          path: prove-1338/
          retention-days: 14
          if-no-files-found: warn
