name: Plugin update tests

# Prove degli aggiornamenti dei plugin dentro un WordPress reale (wp-env): canale vero del portale (solo lettura), finto portale con chiavi di prova,
# aggiornamento dei dati dalla 1.3.25. Non cambiano il plugin: le copie di prova si ottengono con sed dai pacchetti costruiti da build.sh.
# Nessuna chiave o dato personale: il gratuito chiede al portale solo prodotto e versione.

on:
  push:
    branches: [main, "feature/**"]
    paths: ["wordpress/**", ".github/workflows/plugin-prove-aggiornamenti.yml"]
  pull_request:
    paths: ["wordpress/**", ".github/workflows/plugin-prove-aggiornamenti.yml"]
  workflow_dispatch:

jobs:
  canale-reale:
    name: Real portal channel (read only, free 1.3.0 sees and installs the published version)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the packages and make the test copy (version 1.3.0)
        run: |
          bash wordpress/build.sh wordpress/dist-prove
          cd wordpress/dist-prove
          mf=free/associazionesemplice/associazionesemplice.php
          sed -i -E "s/^( \* Version: +)[0-9][0-9.]*/\11.3.0/; s/(define\( 'ASEM_VERSION', ')[0-9][0-9.]*/\11.3.0/" "$mf"
          grep -E "Update URI|^ \* Version:|'ASEM_VERSION'" "$mf"
          mkdir prove
          (cd free && zip -qr ../prove/free-1.3.0.zip associazionesemplice)
          cp ../associazionesemplice/tests/ci/prova-canale-reale.php prove/
          cat > .wp-env.json <<'JSON'
          {
            "phpVersion": "8.1",
            "plugins": [],
            "mappings": { "wp-content/prove": "./prove" },
            "config": { "WP_DEBUG": true, "WP_DEBUG_DISPLAY": false, "WP_DEBUG_LOG": true }
          }
          JSON
      - name: Start WordPress and install the test copy
        working-directory: wordpress/dist-prove
        run: |
          npx --yes @wordpress/env start
          npx --yes @wordpress/env run cli wp plugin install wp-content/prove/free-1.3.0.zip --activate
      - name: See the update in Dashboard → Updates and install it
        working-directory: wordpress/dist-prove
        run: npx --yes @wordpress/env run cli wp eval-file wp-content/prove/prova-canale-reale.php
      - name: Debug log
        if: failure()
        working-directory: wordpress/dist-prove
        run: npx --yes @wordpress/env run cli sh -c 'cat wp-content/debug.log 2>/dev/null | tail -50 || true'

  finto-portale:
    name: Fake portal with test keys (v2 signatures, rollback, signed denial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: sodium
      - name: Build the packages, generate the test keys and make the test copies
        run: |
          bash wordpress/build.sh wordpress/dist-prove
          cd wordpress/dist-prove
          mkdir prove
          php ../associazionesemplice/tests/ci/fake-portal/genkeys.php prove/keys.json
          kid=$(jq -r .pkg.kid prove/keys.json)
          pub=$(jq -r .pkg.pub prove/keys.json)
          # copia di prova: versioni 1.3.0 e, nel solo Updater della copia, chiave pubblica dei pacchetti di prova al posto di quella vera
          up=free/associazionesemplice/includes/Updater.php
          grep -cE "'pkg-[^']+' => '[^']+'" "$up"
          sed -i -E "s/'pkg-[^']+' => '[^']+'/'$kid' => '$pub'/" "$up"
          test "$(grep -oE "'pkg-[^']+' =>" "$up" | sort -u)" = "'$kid' =>"
          grep -qF "'$kid' => '$pub'" "$up"
          sed -i -E "s/^( \* Version: +)[0-9][0-9.]*/\11.3.0/; s/(define\( 'ASEM_VERSION', ')[0-9][0-9.]*/\11.3.0/" free/associazionesemplice/associazionesemplice.php
          sed -i -E "s/^( \* Version: +)[0-9][0-9.]*/\11.3.0/; s/(define\( 'ASEM_PRO_VERSION', ')[0-9][0-9.]*/\11.3.0/" pro/associazionesemplice-pro/associazionesemplice-pro.php
          sed -i -E "s/(define\( 'ASEM_PRO_MIN_FREE', ')[0-9][0-9.]*/\11.3.0/" pro/associazionesemplice-pro/associazionesemplice-pro.php
          (cd free && zip -qr ../prove/free-1.3.0.zip associazionesemplice)
          (cd pro && zip -qr ../prove/pro-1.3.0.zip associazionesemplice-pro)
          echo "contenuto del pacchetto di prova" > pacchetto.txt
          zip -q prove/pacchetto.zip pacchetto.txt
          cp -r ../associazionesemplice/tests/ci/fake-portal prove/fake-portal
          cp ../associazionesemplice/tests/ci/prova-finto-portale.php prove/
          cat > .wp-env.json <<'JSON'
          {
            "phpVersion": "8.1",
            "plugins": [],
            "mappings": { "wp-content/prove": "./prove" },
            "config": { "WP_DEBUG": true, "WP_DEBUG_DISPLAY": false, "WP_DEBUG_LOG": true }
          }
          JSON
      - name: Start WordPress and install free + Pro (test copies)
        working-directory: wordpress/dist-prove
        run: |
          npx --yes @wordpress/env start
          npx --yes @wordpress/env run cli wp plugin install wp-content/prove/free-1.3.0.zip --activate
          npx --yes @wordpress/env run cli wp plugin install wp-content/prove/pro-1.3.0.zip --activate
      - name: Run the fake portal cases
        working-directory: wordpress/dist-prove
        run: npx --yes @wordpress/env run cli wp eval-file wp-content/prove/prova-finto-portale.php
      - name: Fake portal log and debug log
        if: failure()
        working-directory: wordpress/dist-prove
        run: npx --yes @wordpress/env run cli sh -c 'tail -30 /tmp/fake-portal.log 2>/dev/null; tail -50 wp-content/debug.log 2>/dev/null || true'

  dati-1-3-25:
    name: Update from the 1.3.25 build keeps the data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the current package and take the 1.3.25 zip (published bytes, at the repository root)
        run: |
          unzip -p associazionesemplice.zip associazionesemplice/associazionesemplice.php | grep -E "^ \* Version:"
          unzip -p associazionesemplice.zip associazionesemplice/associazionesemplice.php | grep -qE "^ \* Version: +1\.3\.25$"
          bash wordpress/build.sh wordpress/dist-prove
          cd wordpress/dist-prove
          mkdir prove
          cp ../../associazionesemplice.zip prove/vecchia-1.3.25.zip
          cp associazionesemplice.zip prove/corrente.zip
          cp ../associazionesemplice/tests/ci/prova-dati-*.php prove/
          cat > .wp-env.json <<'JSON'
          {
            "phpVersion": "8.1",
            "plugins": [],
            "mappings": { "wp-content/prove": "./prove" },
            "config": { "WP_DEBUG": true, "WP_DEBUG_DISPLAY": false, "WP_DEBUG_LOG": true }
          }
          JSON
      - name: Start WordPress, install 1.3.25 and create members and movements
        working-directory: wordpress/dist-prove
        run: |
          npx --yes @wordpress/env start
          npx --yes @wordpress/env run cli wp plugin install wp-content/prove/vecchia-1.3.25.zip --activate
          npx --yes @wordpress/env run cli wp eval-file wp-content/prove/prova-dati-crea.php
      - name: Install the current build over it and check the data
        working-directory: wordpress/dist-prove
        run: |
          npx --yes @wordpress/env run cli wp plugin install wp-content/prove/corrente.zip --force
          npx --yes @wordpress/env run cli wp plugin list --fields=name,status,version
          npx --yes @wordpress/env run cli wp eval-file wp-content/prove/prova-dati-verifica.php
      - name: Debug log
        if: failure()
        working-directory: wordpress/dist-prove
        run: npx --yes @wordpress/env run cli sh -c 'cat wp-content/debug.log 2>/dev/null | tail -50 || true'

  uscita-corsi:
    name: From 1.3.39 with the demo data; old Pro 1.3.25 with the new free
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # 1.3.39 e Pro 1.3.25 = i pacchetti costruiti dal commit della pubblicazione (cc7e542f, «Versioni: free 1.3.39 e Pro 1.3.25»); i dati sono quelli
      # della demo di allora (demo/provision.php ed extra-data.php dello stesso commit), gli stessi con cui la demo si rifà ogni notte. Una copia: la demo non si tocca.
      - name: Build the 1.3.39 packages (commit cc7e542f) and the current ones
        shell: bash
        run: |
          set -euo pipefail
          OLD="$RUNNER_TEMP/v1339"
          git worktree add --detach "$OLD" cc7e542f
          (cd "$OLD" && bash wordpress/build.sh "$OLD/dist")
          unzip -p "$OLD/dist/associazionesemplice.zip" associazionesemplice/associazionesemplice.php | grep -E "^ \* Version: +1\.3\.39$"
          unzip -p "$OLD/dist/associazionesemplice-pro.zip" associazionesemplice-pro/associazionesemplice-pro.php | grep -E "^ \* Version: +1\.3\.25$"
          bash wordpress/build.sh wordpress/dist-uscita
          cd wordpress/dist-uscita
          mkdir -p prove
          cp "$OLD/dist/associazionesemplice.zip" prove/free-1.3.39.zip
          cp "$OLD/dist/associazionesemplice-pro.zip" prove/pro-1.3.25.zip
          cp associazionesemplice.zip prove/free-nuovo.zip
          cp associazionesemplice-pro.zip prove/pro-nuovo.zip
          cp ../associazionesemplice/tests/ci/prova-uscita-*.php ../../.github/scripts/prepara-demo.php prove/
          cp -r "$OLD/demo" prove/demo-seed
          cat > .wp-env.json <<'JSON'
          {
            "phpVersion": "8.1",
            "plugins": [],
            "mappings": { "wp-content/prove": "./prove", "wp-content/demo-seed": "./prove/demo-seed" },
            "config": { "WP_DEBUG": true, "WP_DEBUG_DISPLAY": false, "WP_DEBUG_LOG": true }
          }
          JSON
      - name: Install 1.3.39 + Pro 1.3.25, load the demo data, take the first snapshot
        working-directory: wordpress/dist-uscita
        shell: bash
        run: |
          wpc() { npx --yes @wordpress/env run cli wp "$@"; }
          npx --yes @wordpress/env start
          wpc plugin install wp-content/prove/free-1.3.39.zip --activate
          wpc plugin install wp-content/prove/pro-1.3.25.zip --activate
          wpc eval-file wp-content/prove/prepara-demo.php
          wpc plugin list --fields=name,status,version
          wpc eval-file wp-content/prove/prova-uscita-istantanea.php prima
      - name: New free with the old Pro 1.3.25 (data unchanged, course pages and attendance register)
        working-directory: wordpress/dist-uscita
        shell: bash
        run: |
          wpc() { npx --yes @wordpress/env run cli wp "$@"; }
          wpc plugin install wp-content/prove/free-nuovo.zip --force
          wpc plugin list --fields=name,status,version
          wpc plugin is-active associazionesemplice-pro
          wpc eval-file wp-content/prove/prova-uscita-istantanea.php mezzo
          wpc eval-file wp-content/prove/prova-uscita-confronta.php prima mezzo
          wpc eval-file wp-content/prove/prova-uscita-pagine.php "gratuito nuovo + Pro 1.3.25" crea
          wpc eval-file wp-content/prove/prova-uscita-istantanea.php mezzo2
      - name: New Pro too (data unchanged, pages)
        working-directory: wordpress/dist-uscita
        shell: bash
        run: |
          wpc() { npx --yes @wordpress/env run cli wp "$@"; }
          wpc plugin install wp-content/prove/pro-nuovo.zip --force
          wpc plugin list --fields=name,status,version
          wpc plugin is-active associazionesemplice-pro
          wpc eval-file wp-content/prove/prova-uscita-istantanea.php dopo
          wpc eval-file wp-content/prove/prova-uscita-confronta.php mezzo2 dopo
          wpc eval-file wp-content/prove/prova-uscita-pagine.php "gratuito nuovo + Pro nuovo"
      - name: No PHP errors from the plugins in the debug log
        working-directory: wordpress/dist-uscita
        shell: bash
        run: |
          npx --yes @wordpress/env run cli sh -c 'cat wp-content/debug.log 2>/dev/null || true' > debug.txt
          if grep -E "PHP (Fatal|Warning|Notice|Deprecated|Parse).*associazionesemplice" debug.txt; then echo "::error::Errori PHP dei plugin nel registro"; exit 1; fi
          echo "Registro senza errori PHP dei plugin."
      - name: Debug log
        if: failure()
        working-directory: wordpress/dist-uscita
        run: npx --yes @wordpress/env run cli sh -c 'cat wp-content/debug.log 2>/dev/null | tail -80 || true'

  pro-copione:
    name: Pro data script (the current build stands in for the old one; no secrets)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build, install, create the Pro data, install over, check
        run: |
          bash wordpress/build.sh "$RUNNER_TEMP/standin"
          bash wordpress/associazionesemplice/tests/ci/prova-pro.sh "$RUNNER_TEMP/standin/associazionesemplice.zip" "$RUNNER_TEMP/standin/associazionesemplice-pro.zip"
      - name: Debug log
        if: failure()
        working-directory: wordpress/dist-prove
        run: npx --yes @wordpress/env run cli sh -c 'cat wp-content/debug.log 2>/dev/null | tail -50 || true'

  pro-1-3-12:
    name: Pro from the published 1.3.12 (real license key, main only)
    # Mai su pull request (quindi mai da fork): il segreto esiste solo per i push a main e gli avvii manuali di questo repository.
    if: github.event_name != 'pull_request' && github.repository == 'wegastudios/associazionesemplice.it'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: portale-licenza-demo
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # le prove di aggiornamento costruiscono le versioni precedenti dai loro commit
          persist-credentials: false

      - name: Download the published Pro from the portal (skip with a warning when the secret is missing)
        id: scarica
        shell: bash
        env:
          DEMO_LICENSE_KEY: ${{ secrets.DEMO_LICENSE_KEY }}
          DOMINIO: ${{ vars.DEMO_LICENSE_DOMAIN || 'associazionesemplice.it' }}
        run: |
          if [ -z "$DEMO_LICENSE_KEY" ]; then
            echo "::warning title=Prova del Pro pubblicato SALTATA::Saltato: manca il segreto DEMO_LICENSE_KEY, il Pro pubblicato non è stato provato."
            echo "have=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Pro dalla versione pubblicata"
              echo "Saltato: il segreto GitHub DEMO_LICENSE_KEY non esiste, quindi il Pro pubblicato non è stato scaricato né provato."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          KEY="$(printf '%s' "$DEMO_LICENSE_KEY" | tr -d '[:space:]')"
          echo "::add-mask::$KEY"
          export KEY
          umask 077
          # la chiave va nel corpo della richiesta da un file (mai sulla riga di comando); lo zip scaricato resta fuori dall'area di lavoro, non è un artefatto e non entra nel repository
          jq -n --arg d "$DOMINIO" '{product: "pro", version: "0.0.1", domain: $d, license_key: env.KEY}' > "$RUNNER_TEMP/richiesta.json"
          # Un solo nuovo tentativo dopo 20 secondi (il 403 del 26/11 era intermittente). Il motivo (codice e messaggio del portale, mai la chiave) va nel log.
          for tentativo in 1 2; do
            code="$(curl -sS -D "$RUNNER_TEMP/intestazioni.txt" -o "$RUNNER_TEMP/risposta.json" -w '%{http_code}' -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' --data-binary @"$RUNNER_TEMP/richiesta.json" https://associazionesemplice.it/api/plugin/update || true)"
            [ "$code" = "200" ] && break
            echo "Tentativo $tentativo: il portale ha risposto $code (codice: $(jq -r '.error.code // .reason_code // "n/d"' "$RUNNER_TEMP/risposta.json" 2>/dev/null || echo n/d); messaggio: $(jq -r '.error.message // .message // "n/d"' "$RUNNER_TEMP/risposta.json" 2>/dev/null | cut -c1-200 || echo n/d))"
            # Intestazioni utili a capire chi ha risposto (il portale o un firewall davanti): solo server, tipo di contenuto, via, cf-ray e simili; mai cookie né altro. Per il 403 anche l'inizio della pagina se non è JSON.
            grep -iE "^(HTTP/|server:|content-type:|via:|cf-ray:|x-cache:|x-sucuri|x-served-by:|retry-after:)" "$RUNNER_TEMP/intestazioni.txt" 2>/dev/null | tr -d "" | sed "s/^/    intestazione: /" || true
            [ "$code" = "403" ] && ! jq -e . "$RUNNER_TEMP/risposta.json" >/dev/null 2>&1 && echo "    corpo non JSON, inizio: $(head -c 200 "$RUNNER_TEMP/risposta.json" | tr -s "[:space:]" " ")" || true
            [ "$tentativo" = "1" ] && sleep 20
          done
          rm -f "$RUNNER_TEMP/richiesta.json" "$RUNNER_TEMP/intestazioni.txt"
          if [ "$code" != "200" ]; then
            echo "::error::Il portale ha risposto $code alla richiesta del Pro anche al secondo tentativo (403: licenza non in regola o legata a un altro dominio, imposta la variabile DEMO_LICENSE_DOMAIN; 429: troppe richieste). Il motivo è nelle righe «Tentativo» qui sopra."
            rm -f "$RUNNER_TEMP/risposta.json"
            exit 1
          fi
          ver="$(jq -r .version "$RUNNER_TEMP/risposta.json")"
          pkg="$(jq -r '.package // empty' "$RUNNER_TEMP/risposta.json")"
          sha="$(jq -r '.sha256 // empty' "$RUNNER_TEMP/risposta.json")"
          rm -f "$RUNNER_TEMP/risposta.json"
          case "$pkg" in https://associazionesemplice.it/*) ;; *) echo "::error::Indirizzo del pacchetto inatteso"; exit 1 ;; esac
          curl -sS --fail -o "$RUNNER_TEMP/pro-pubblicato.zip" "$pkg"
          [ "$(sha256sum "$RUNNER_TEMP/pro-pubblicato.zip" | cut -d' ' -f1)" = "$sha" ] || { echo "::error::L'impronta dello zip scaricato non coincide con quella dichiarata dal portale"; exit 1; }
          echo "Pro pubblicato scaricato: versione $ver"
          echo "have=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        if: steps.scarica.outputs.have == 'true'
        with:
          node-version: 20

      - name: Download the published free package (public request) and check its hash and its version against what the Pro requires
        if: steps.scarica.outputs.have == 'true'
        shell: bash
        run: |
          resp="$(curl -sS --fail -X POST -H 'Content-Type: application/json' -H 'Accept: application/json' -d '{"product":"free","version":"0.0.1","domain":"example.org"}' https://associazionesemplice.it/api/plugin/update)"
          ver="$(jq -r .version <<<"$resp")"; pkg="$(jq -r '.package // empty' <<<"$resp")"; sha="$(jq -r '.sha256 // empty' <<<"$resp")"
          case "$pkg" in https://associazionesemplice.it/*) ;; *) echo "::error::Indirizzo del pacchetto gratuito inatteso"; exit 1 ;; esac
          curl -sS --fail -o "$RUNNER_TEMP/gratuito-pubblicato.zip" "$pkg"
          [ "$(sha256sum "$RUNNER_TEMP/gratuito-pubblicato.zip" | cut -d' ' -f1)" = "$sha" ] || { echo "::error::L'impronta del gratuito scaricato non coincide con quella dichiarata dal portale"; exit 1; }
          min="$(unzip -p "$RUNNER_TEMP/pro-pubblicato.zip" associazionesemplice-pro/associazionesemplice-pro.php | grep -oE "ASEM_PRO_MIN_FREE', '[0-9.]+" | grep -oE "[0-9.]+$")"
          echo "Gratuito pubblicato: $ver (il Pro pubblicato richiede almeno $min)"
          [ -n "$min" ] && [ "$(printf '%s\n%s\n' "$min" "$ver" | sort -V | head -1)" = "$min" ] || { echo "::error::Il gratuito pubblicato ($ver) è sotto la versione minima richiesta dal Pro pubblicato ($min)"; exit 1; }

      - name: Published free + published Pro, create the Pro data, install the current build over, check
        if: steps.scarica.outputs.have == 'true'
        shell: bash
        run: |
          unzip -p "$RUNNER_TEMP/gratuito-pubblicato.zip" associazionesemplice/associazionesemplice.php | grep -E "^ \* Version:"
          unzip -p "$RUNNER_TEMP/pro-pubblicato.zip" associazionesemplice-pro/associazionesemplice-pro.php | grep -E "^ \* Version:"
          bash wordpress/associazionesemplice/tests/ci/prova-pro.sh "$RUNNER_TEMP/gratuito-pubblicato.zip" "$RUNNER_TEMP/pro-pubblicato.zip"

      - name: From the previous versions to the published packages (free 1.3.36 and 1.3.35 with Pro 1.3.23), and the published Pro on free 1.3.25 (suspended with a notice, site 200)
        if: steps.scarica.outputs.have == 'true'
        shell: bash
        run: bash wordpress/associazionesemplice/tests/ci/prova-aggiornamento-pubblicati.sh "$RUNNER_TEMP/gratuito-pubblicato.zip" "$RUNNER_TEMP/pro-pubblicato.zip" associazionesemplice.zip

      - name: Debug log
        if: failure() && steps.scarica.outputs.have == 'true'
        working-directory: wordpress/dist-prove
        run: npx --yes @wordpress/env run cli sh -c 'cat wp-content/debug.log 2>/dev/null | tail -50 || true'

      - name: Remove the downloaded zip
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/pro-pubblicato.zip" "$RUNNER_TEMP/gratuito-pubblicato.zip" "$RUNNER_TEMP/risposta.json" "$RUNNER_TEMP/richiesta.json"
          rm -rf wordpress/dist-prove

  pro-su-gratuito-vecchio:
    name: New Pro on older free versions (no fatal error, notice, resumes after the update)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { ver: "1.3.25", commit: "0a421746" }
          - { ver: "1.3.26", commit: "52c08bdd" }
          - { ver: "1.3.30", commit: "0225b1f5" }
          - { ver: "1.3.35", commit: "5d0811d4" }
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pro built from this branch on free ${{ matrix.ver }}; the Pro 1.3.23 for comparison
        shell: bash
        run: bash wordpress/associazionesemplice/tests/ci/prova-pro-su-free-vecchio.sh "${{ matrix.ver }}" "${{ matrix.commit }}" c30b5143
