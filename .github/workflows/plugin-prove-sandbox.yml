name: Plugin sandbox tests

# «Schermate dei pannelli»: serve un browser; gira anche sulle pull request, senza segreti; le immagini si scaricano dall'artefatto del job.
# La prova del rimborso Stripe in sandbox (segreto STRIPE_TEST_SECRET) sta in plugin-prove-stripe.yml: gira solo quando cambiano i file dei pagamenti Stripe, o a mano.

on:
  push:
    branches: [main]
    paths: ["wordpress/**", "demo/**", ".github/scripts/**", ".github/workflows/plugin-prove-sandbox.yml"]
  pull_request:
    paths: ["wordpress/**", "demo/**", ".github/scripts/**", ".github/workflows/plugin-prove-sandbox.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  screenshots:
    name: Schermate dei pannelli
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the packages and start WordPress (free + Pro)
        shell: bash
        run: |
          bash wordpress/build.sh wordpress/dist
          cd wordpress/dist
          cat > .wp-env.json <<'JSON'
          {
            "phpVersion": "8.1",
            "plugins": [
              "./free/associazionesemplice",
              "./pro/associazionesemplice-pro"
            ],
            "mappings": {
              "wp-content/demo-seed": "../../demo",
              "wp-content/sandbox-scripts": "../../.github/scripts"
            },
            "config": { "WP_DEBUG": true, "WP_DEBUG_DISPLAY": false, "WP_DEBUG_LOG": true }
          }
          JSON
          npx --yes @wordpress/env start

      - name: Example data (the repository demo seed)
        continue-on-error: true
        shell: bash
        working-directory: wordpress/dist
        run: npx --yes @wordpress/env run cli wp eval-file wp-content/sandbox-scripts/prepara-demo.php

      - name: Install Playwright (Chromium)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/pw"
          cd "$RUNNER_TEMP/pw"
          npm init -y > /dev/null
          npm install --no-audit --no-fund playwright@1.49.1
          npx playwright install --with-deps chromium

      - name: Take the screenshots
        shell: bash
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: node .github/scripts/prove-schermate.cjs http://localhost:8888 schermate

      - name: Outcome
        if: always()
        shell: bash
        run: |
          if [ -f schermate/esito.md ]; then
            cat schermate/esito.md >> "$GITHUB_STEP_SUMMARY"
            if grep -q '^- MANCA' schermate/esito.md; then
              while IFS= read -r l; do echo "::warning::$l"; done < <(grep '^- MANCA' schermate/esito.md)
            fi
          else
            echo "::warning::Nessun esito: lo script delle schermate non è arrivato in fondo."
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schermate-pannelli
          path: schermate/
          retention-days: 14
          if-no-files-found: warn

      # La cassa di un corso in un browser vero: l'importo proposto è quello calcolato dal server. Più le schermate dei corsi a 1440 e 375 px.
      - name: Cassa dei corsi (primo mese in proporzione)
        if: always()
        shell: bash
        working-directory: wordpress/dist
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          mkdir -p ../../corsi
          npx --yes @wordpress/env run cli wp eval-file wp-content/sandbox-scripts/prepara-corsi.php | tr -d '\r' | grep '^{' | tail -1 > ../../corsi/attesi.json
          node ../../.github/scripts/prove-corsi.cjs http://localhost:8888 ../../corsi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schermate-corsi
          path: corsi/
          retention-days: 14
          if-no-files-found: warn

      # I lavori lunghi avanzano dalla pagina e «Annulla» li ferma. Il cron del sito è spento e ogni richiesta fa una tappa sola: ad andare avanti è la pagina.
      - name: Lavori lunghi dalla pagina
        if: always()
        shell: bash
        working-directory: wordpress/dist
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          wpc() { npx --yes @wordpress/env run cli wp "$@"; }
          wpc config set DISABLE_WP_CRON true --raw
          wpc eval 'wp_mkdir_p( WPMU_PLUGIN_DIR ); file_put_contents( WPMU_PLUGIN_DIR . "/asem-tappe.php", "<?php add_filter( \"asem_long_job_budget_seconds\", \"__return_zero\" );" );'
          rc=0
          wpc eval 'wp_set_current_user( 1 ); \AssociazioneSemplice\Backup::start_job( false );'
          node ../../.github/scripts/prove-lavori.cjs http://localhost:8888 avanza ../../lavori || rc=1
          wpc eval 'wp_set_current_user( 1 ); \AssociazioneSemplice\Backup::start_job( false );'
          node ../../.github/scripts/prove-lavori.cjs http://localhost:8888 annulla ../../lavori || rc=1
          wpc eval 'unlink( WPMU_PLUGIN_DIR . "/asem-tappe.php" );'
          wpc config delete DISABLE_WP_CRON
          exit $rc

      # Schermate nuove dei corsi con date finte (modulo mu tolto alla fine): prova gratuita, lezioni del mese, lezioni annullate con recupero e
      # restituzione, Bacheca, pagamento in moneta nell'area soci; poi, dopo la scadenza, la chiusura degli importi a favore scaduti.
      - name: Corsi nuovi nel browser (date finte)
        if: always()
        shell: bash
        working-directory: wordpress/dist
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          wpc() { npx --yes @wordpress/env run cli wp "$@"; }
          mkdir -p ../../uscita
          wpc eval 'wp_mkdir_p( WPMU_PLUGIN_DIR ); copy( WP_CONTENT_DIR . "/sandbox-scripts/asem-data-prova.php", WPMU_PLUGIN_DIR . "/asem-data-prova.php" );'
          wpc eval-file wp-content/sandbox-scripts/prepara-uscita-corsi.php | tr -d '\r' | grep '^{' | tail -1 > ../../uscita/dati.json
          rc=0
          node ../../.github/scripts/prove-uscita-corsi.cjs http://localhost:8888 1 ../../uscita || rc=1
          wpc option update asem_prova_oggi "$(node -e 'console.log(require(process.argv[1]).phase2)' "$PWD/../../uscita/dati.json")"
          node ../../.github/scripts/prove-uscita-corsi.cjs http://localhost:8888 2 ../../uscita || rc=1
          wpc eval 'unlink( WPMU_PLUGIN_DIR . "/asem-data-prova.php" ); delete_option( "asem_prova_oggi" );'
          node -e 'const f=process.argv[1]; const d=require(f); delete d.member; require("fs").writeFileSync(f, JSON.stringify(d))' "$PWD/../../uscita/dati.json" # l'accesso del socio di prova non va nell'artefatto
          cat ../../uscita/esito.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $rc

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corsi-nuovi
          path: uscita/
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lavori-lunghi
          path: lavori/
          retention-days: 14
          if-no-files-found: ignore

      # Le schede dell'elenco attività su un tema a blocchi (twentytwentyfive) e su uno classico (twentyfifteen): schermate a cinque larghezze,
      # senza scorrimento orizzontale, immagini tutte 16/9, titolo con contrasto sufficiente (anche con tema scuro del browser).
      - name: Schede dell'elenco attività su temi veri
        if: always()
        shell: bash
        working-directory: wordpress/dist
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
        run: |
          wpc() { npx @wordpress/env run cli wp "$@"; }
          PAGE=$(wpc post create --post_type=page --post_title="Attività ed eventi" --post_status=publish --post_content='[associazionesemplice_attivita]' --porcelain | tr -d '\r' | tail -1)
          mkdir -p ../../schede
          rc=0
          for t in twentytwentyfive twentyfifteen; do
            wpc theme install "$t" --activate || { echo "::warning::tema $t non installato"; continue; }
            node ../../.github/scripts/prove-schede-eventi.cjs "http://localhost:8888/?page_id=$PAGE" "$t" ../../schede || rc=1
          done
          cat ../../schede/esito-schede.md >> "$GITHUB_STEP_SUMMARY" || true
          exit $rc

      - name: Schede attività (schermate)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schede-attivita
          path: schede/
          retention-days: 14
          if-no-files-found: warn

      # Il QR della tessera (immagine a 1 bit nel PDF, SVG nell'area soci) deve restare leggibile da un telefono: lo rileggiamo con zbarimg a due
      # risoluzioni e confrontiamo il contenuto con l'indirizzo atteso. Gira dopo le schermate, così un QR illeggibile non le ferma.
      - name: QR della tessera leggibile (PDF a 150 e 300 dpi, SVG)
        if: always()
        shell: bash
        working-directory: wordpress/dist
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils zbar-tools librsvg2-bin
          npx --yes @wordpress/env run cli wp eval-file wp-content/sandbox-scripts/prova-qr-tessera.php > "$RUNNER_TEMP/qr-raw.txt"
          bash "$GITHUB_WORKSPACE/.github/scripts/prova-qr-tessera.sh" "$RUNNER_TEMP/qr-raw.txt" "$GITHUB_WORKSPACE/qr-prova"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qr-tessera
          path: qr-prova/
          retention-days: 14
          if-no-files-found: ignore
